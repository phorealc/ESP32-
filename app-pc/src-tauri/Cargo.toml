[package]
name = "dashboard-pc"
version = "0.1.0"
description = "Coquille Tauri du Dashboard ESP32 (Phorealc)"
edition = "2021"
rust-version = "1.77"

[lib]
name = "dashboard_pc_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
