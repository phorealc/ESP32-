[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dashboard-engine"
version = "0.1.0"
description = "Moteur d'agregation de donnees pour le Dashboard ESP32 (Phorealc)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "mcstatus>=11.1",
    "websockets>=12.0",
    "winsdk>=1.0.0b10 ; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[project.scripts]
dashboard-engine = "dashboard_engine.__main__:main"

[tool.setuptools.packages.find]
include = ["dashboard_engine*"]

# Le modele de configuration voyage avec le paquet : l'application installee
# s'en sert pour creer un config.toml editable au premier lancement.
[tool.setuptools.package-data]
dashboard_engine = ["config.example.toml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
