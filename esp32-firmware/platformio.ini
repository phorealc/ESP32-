; Dashboard ESP32 — Waveshare ESP32-S3-Touch-LCD-7 (800x480, LVGL)
;
; Compilation :  pio run
; Televersement : pio run -t upload && pio device monitor

[platformio]
default_envs = waveshare-s3-7inch

[env:waveshare-s3-7inch]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino

; La carte embarque 16 Mio de flash et 8 Mio de PSRAM en OPI ; sans ces
; reglages, la PSRAM n'est pas detectee et le tampon LVGL echoue a s'allouer.
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, colorize

build_flags =
    -std=gnu++17
    -DBOARD_HAS_PSRAM
    -DLV_CONF_INCLUDE_SIMPLE
    -DARDUINO_USB_CDC_ON_BOOT=1
    -Iinclude
    -Isrc
    ; Le bus RGB tire beaucoup sur le cache flash ; -O2 limite les dechirures.
    -O2

build_unflags = -std=gnu++11

lib_deps =
    lvgl/lvgl@^8.3.11
    moononournation/GFX Library for Arduino@^1.4.9
    bblanchon/ArduinoJson@^7.1.0

; `app_config.h` est cree a partir de app_config.example.h et reste hors du depot.
