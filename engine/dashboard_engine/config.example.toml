# Configuration du moteur — copier en `config.toml` puis adapter.
# Les secrets peuvent rester hors de ce fichier et etre passes par variables
# d'environnement (voir README : DASHBOARD_WEATHER_API_KEY, etc.).

[server]
host = "0.0.0.0"          # 0.0.0.0 pour que l'ESP32 puisse joindre le PC
port = 8787
token = ""                # si non vide, requis dans l'en-tete X-Dashboard-Token
cors_origins = ["*"]

[music]
enabled = true
interval_s = 1.0

[minecraft]
enabled = true
interval_s = 30.0
timeout_s = 5.0

[[minecraft.servers]]
name = "Survie"
host = "mc.exemple.net"

[[minecraft.servers]]
name = "Creatif"
host = "127.0.0.1:25566"

[weather]
enabled = true
interval_s = 600.0        # OpenWeatherMap gratuit : 60 appels/min, 1M/mois
api_key = ""              # https://home.openweathermap.org/api_keys
city = "Paris,FR"
units = "metric"
lang = "fr"
forecast_points = 6       # 6 creneaux de 3 h = 18 h de prevision

[stream]
enabled = true
interval_s = 60.0
twitch_client_id = ""     # https://dev.twitch.tv/console/apps
twitch_client_secret = ""
twitch_login = "phorealc"

# Logiciel de diffusion interroge. Les deux ne parlent pas le meme protocole,
# d'ou le choix explicite : "obs", "streamlabs", ou "none".
[stream.broadcaster]
kind = "streamlabs"

# --- si kind = "obs" (OBS Studio) ---
url = "ws://127.0.0.1:4455"   # OBS > Outils > Parametres du serveur WebSocket
password = ""

# --- si kind = "streamlabs" (Streamlabs Desktop) ---
# Sous Windows, le tube nomme suffit : rien a activer, rien a renseigner.
use_pipe = true
# Repli TCP, a activer dans Streamlabs > Parametres > Remote Control.
token = ""
host = "127.0.0.1"
port = 59650

# Alertes en direct de streamlabs.com : dons, follows, abonnements.
[stream.streamlabs]
enabled = true
# streamlabs.com > Parametres > API Settings > API Tokens > Socket API Token.
# A traiter comme un mot de passe.
socket_token = ""
keep_events = 8

[checklist]
path = "checklist.json"
default_items = [
    "Lancer OBS",
    "Verifier le micro",
    "Verifier la scene d'accueil",
    "Annoncer le live sur Discord",
    "Lancer la playlist",
]
