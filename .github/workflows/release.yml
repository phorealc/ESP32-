name: Release

# Declenchement manuel pour tester la chaine, ou automatique sur un tag `v*`
# qui publie alors une release GitHub avec l'installeur attache.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    name: Installeur Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app-pc/src-tauri

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Installer le moteur et PyInstaller
        run: pip install ./engine pyinstaller

      # Le moteur devient un .exe autonome : l'utilisateur final n'a pas a
      # installer Python.
      - name: Empaqueter le moteur
        working-directory: engine
        run: pyinstaller dashboard-engine.spec --noconfirm --clean

      # Verifie le binaire avant de le sceller dans l'installeur : c'est ici que
      # se voient les imports dynamiques manquants (uvicorn, winsdk, mcstatus).
      - name: Verifier que le moteur empaquete demarre
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath "engine/dist/dashboard-engine.exe" `
            -ArgumentList "--host","127.0.0.1","--port","8799" -PassThru -NoNewWindow
          try {
            $health = $null
            foreach ($attempt in 1..40) {
              Start-Sleep -Milliseconds 750
              try { $health = Invoke-RestMethod "http://127.0.0.1:8799/api/health" -TimeoutSec 3 } catch { }
              if ($health -and $health.ok) { break }
            }
            if (-not ($health -and $health.ok)) { throw "le moteur empaquete n'a pas repondu" }
            Write-Host "moteur OK — modules : $($health.modules | ConvertTo-Json -Compress)"
            # Sous Windows le module musique doit fonctionner : s'il se plaint de
            # winsdk, c'est que l'empaquetage l'a oublie.
            if ($health.modules.music.error -match "winsdk indisponible") {
              throw "winsdk absent du binaire : $($health.modules.music.error)"
            }
          } finally {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          }

      # Tauri attend le sidecar suffixe par le triplet de la cible.
      - name: Installer le moteur comme sidecar Tauri
        shell: bash
        run: |
          triple=$(rustc -Vv | sed -n 's/^host: //p')
          mkdir -p app-pc/src-tauri/binaries
          cp engine/dist/dashboard-engine.exe \
             "app-pc/src-tauri/binaries/dashboard-engine-${triple}.exe"
          ls -l app-pc/src-tauri/binaries/

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Installer les dependances de la coquille
        working-directory: app-pc
        run: npm install

      # La cle de signature est un secret du depot. Sans elle on sait encore
      # produire un installeur, mais pas de mise a jour automatique : le build
      # continue et le previent, plutot que d'echouer.
      - name: Determiner si la signature est configuree
        id: signing
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -n "$KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY absent — mise a jour automatique desactivee pour cette build"
          fi

      - name: Construire l'application
        working-directory: app-pc
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ "${{ steps.signing.outputs.enabled }}" = "true" ]; then
            npm run build -- --config '{"bundle":{"createUpdaterArtifacts":true}}'
          else
            npm run build
          fi

      # Ce controle attrape la classe de bug la plus couteuse : l'application se
      # lance, l'interface s'affiche, mais le moteur ne demarre jamais et
      # l'ecran reste sur « connexion… ». Il faut lancer l'application pour le
      # voir — construire ne suffit pas.
      - name: Verifier que l'application demarre bien le moteur
        shell: pwsh
        run: |
          $release = "app-pc/src-tauri/target/release"

          # Tauri resout le sidecar dans le dossier de l'executable : s'il n'est
          # pas la, le nom passe a `shell().sidecar()` est faux.
          $sidecar = Join-Path $release "dashboard-engine.exe"
          if (-not (Test-Path $sidecar)) {
            Get-ChildItem $release -Filter *.exe | ForEach-Object { Write-Host "present: $($_.Name)" }
            throw "sidecar absent a cote de l'executable : $sidecar"
          }
          Write-Host "sidecar bien place : $sidecar"

          $app = Get-ChildItem $release -Filter *.exe |
                 Where-Object { $_.Name -ne "dashboard-engine.exe" } |
                 Select-Object -First 1
          if (-not $app) { throw "executable de l'application introuvable dans $release" }
          Write-Host "lancement de $($app.Name)"

          $out = Join-Path $env:RUNNER_TEMP "app-stdout.log"
          $proc = Start-Process -FilePath $app.FullName -PassThru `
                    -RedirectStandardOutput $out -RedirectStandardError "$out.err"
          try {
            $health = $null
            foreach ($attempt in 1..40) {
              Start-Sleep -Milliseconds 750
              try { $health = Invoke-RestMethod "http://127.0.0.1:8787/api/health" -TimeoutSec 3 } catch { }
              if ($health -and $health.ok) { break }
            }
            if (-not ($health -and $health.ok)) {
              Write-Host "--- sortie de l'application ---"
              Get-Content $out, "$out.err" -ErrorAction SilentlyContinue | Write-Host
              throw "l'application n'a pas demarre le moteur (rien sur 127.0.0.1:8787)"
            }
            Write-Host "le moteur repond — l'application le lance correctement"
          } finally {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            Get-Process dashboard-engine -ErrorAction SilentlyContinue | Stop-Process -Force
          }

      # Tauri nomme ses installeurs d'apres `productName`, qui contient un
      # espace ; GitHub remplace les espaces par des points a l'upload, ce qui
      # casserait l'URL inscrite dans le manifeste de mise a jour. On normalise
      # donc les noms nous-memes plutot que de deviner ce que GitHub en fera.
      - name: Preparer les fichiers de release
        id: stage
        shell: pwsh
        run: |
          $bundle = "app-pc/src-tauri/target/release/bundle"
          $staging = "release-files"
          New-Item -ItemType Directory -Force -Path $staging | Out-Null

          $version = (Get-Content app-pc/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $setup = Get-ChildItem "$bundle/nsis" -Filter *-setup.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $setup) { throw "installeur NSIS introuvable dans $bundle/nsis" }

          $setupName = "Dashboard-Phorealc_${version}_x64-setup.exe"
          Copy-Item $setup.FullName (Join-Path $staging $setupName)

          $msi = Get-ChildItem "$bundle/msi" -Filter *.msi -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($msi) { Copy-Item $msi.FullName (Join-Path $staging "Dashboard-Phorealc_${version}_x64.msi") }

          "version=$version"     | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "setup_name=$setupName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Get-ChildItem $staging | ForEach-Object { Write-Host "pret: $($_.Name)" }

      # Le manifeste que l'application interroge pour savoir si elle est a jour.
      - name: Generer le manifeste de mise a jour
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        run: |
          $bundle = "app-pc/src-tauri/target/release/bundle/nsis"
          $sig = Get-ChildItem $bundle -Filter *-setup.exe.sig -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $sig) {
            Get-ChildItem $bundle | ForEach-Object { Write-Host "present: $($_.Name)" }
            throw "signature absente : la cle est-elle valide ? (createUpdaterArtifacts)"
          }

          $version = "${{ steps.stage.outputs.version }}"
          $setupName = "${{ steps.stage.outputs.setup_name }}"
          # Sur un tag on connait l'URL definitive ; sinon le manifeste ne sert
          # qu'a prouver que la signature est bien produite.
          $tag = if ("${{ github.ref }}".StartsWith("refs/tags/")) { "${{ github.ref_name }}" } else { "v$version" }

          $manifest = [ordered]@{
            version   = $version
            notes     = "Voir les notes de version sur GitHub."
            pub_date  = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = [ordered]@{
              "windows-x86_64" = [ordered]@{
                signature = (Get-Content $sig.FullName -Raw).Trim()
                url = "https://github.com/${{ github.repository }}/releases/download/$tag/$setupName"
              }
            }
          }
          $manifest | ConvertTo-Json -Depth 6 | Set-Content "release-files/latest.json" -Encoding utf8
          Write-Host "--- latest.json ---"
          Get-Content "release-files/latest.json" | Write-Host

      - name: Publier les installeurs en artefact
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-phorealc-windows
          path: release-files/*
          if-no-files-found: error

      - name: Attacher les installeurs a la release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: release-files/*
